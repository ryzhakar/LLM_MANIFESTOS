[project]
name = "unharness"
version = "3.5.0"
description = "Compile a manifesto stack into a session's system prompt and launch Claude Code with it."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
unharness = "unharness.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
